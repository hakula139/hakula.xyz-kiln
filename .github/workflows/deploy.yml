name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true
      base-url: ${{ github.ref_name == 'dev' && 'https://dev.hakula.xyz' || '' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
      url: ${{ github.ref_name == 'dev' && 'https://dev.hakula.xyz' || 'https://hakula.xyz' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-public
          path: public/

      - name: Deploy to Cloudflare Workers
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ github.ref_name == 'dev' && 'dev' || '' }}
        run: |
          branch_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq '.object.sha')"
          if [[ "$branch_head" != "$GITHUB_SHA" ]]; then
            echo "::error::Refusing to deploy outdated commit $GITHUB_SHA. Current branch head is $branch_head."
            exit 1
          fi

          nix develop -c pnpm exec wrangler deploy --env "$WRANGLER_ENV"
