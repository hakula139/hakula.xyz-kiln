name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true
      base-url: ${{ github.ref_name == 'dev' && 'https://dev.hakula.xyz' || '' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'dev' && 'development' || 'production' }}
      url: ${{ github.ref_name == 'dev' && 'https://dev.hakula.xyz' || 'https://hakula.xyz' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: hakulab/devkit/.github/actions/setup-nix@v3

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-public
          path: public/

      - name: Deploy to Cloudflare Workers
        id: workers
        uses: hakula139/devkit/.github/actions/workers@v3
        with:
          wrangler-environment: ${{ github.ref_name == 'dev' && 'dev' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Require a branch deployment
        if: steps.workers.outputs.applied != 'true'
        run: exit 1
