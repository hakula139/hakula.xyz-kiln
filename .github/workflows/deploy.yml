name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true
      base-url: ${{ github.ref_name == 'dev' && 'https://dev.hakula.xyz' || '' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_name: hakula
          cachix_skip_push: 'true'

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-public
          path: public/

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ github.ref_name == 'dev' && 'dev' || '' }}
        run: nix develop -c pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}
