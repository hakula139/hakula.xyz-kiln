name: Preview cleanup

on:
  # Holds deploy secrets and a write token, so never check out or run PR code.
  pull_request_target:
    types: [closed]

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: hakulab/devkit/.github/actions/setup-nix@v3

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Delete preview
        id: workers
        uses: hakulab/devkit/.github/actions/workers@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deactivate deployments
        if: steps.workers.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop -c nu --no-config-file scripts/deactivate-preview-deployments.nu

      - name: Comment preview
        if: steps.workers.outputs.applied == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url
          only_update: true
          message: |
            ### Site preview

            The preview was deleted when this pull request closed.

            [Cleanup logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
