name: Preview cleanup

on:
  # Holds deploy secrets and a write token, so never check out or run PR code.
  pull_request_target:
    types: [closed]

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      queue: max
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Delete preview
        id: workers
        uses: hakula139/devkit/.github/actions/workers@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deactivate deployments
        if: steps.workers.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          query=$(cat <<'GRAPHQL'
          query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $number) {
                timelineItems(first: 100, after: $endCursor, itemTypes: [DEPLOYED_EVENT]) {
                  nodes {
                    ... on DeployedEvent { deployment { databaseId environment } }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }
          GRAPHQL
          )

          ids=$(gh api graphql \
            --paginate \
            -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f repo="${GITHUB_REPOSITORY#*/}" \
            -F number="$PR_NUMBER" \
            -f query="$query" \
            --jq '.data.repository.pullRequest.timelineItems.nodes[].deployment
              | select(.environment == "preview")
              | .databaseId')

          for id in $ids; do
            gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
              -f state=inactive \
              --silent
          done

      - name: Comment preview
        if: steps.workers.outputs.applied == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url
          only_update: true
          message: |
            ## ⚡ Cloudflare Workers preview

            This PR's preview was deleted when it closed.

            [View cleanup logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
