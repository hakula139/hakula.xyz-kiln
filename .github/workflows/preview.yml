name: Preview deploy

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true
      base-url: https://pr-${{ github.event.pull_request.number }}-hakula-xyz-kiln.hakula.workers.dev

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      queue: max
    environment:
      name: preview
      url: ${{ steps.workers.outputs.deployment-url }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v3

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: site-public
          path: public/

      - name: Verify the preview merge ref
        run: |
          current_ref=$(git ls-remote --exit-code origin "$GITHUB_REF")
          if [[ "${current_ref%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "::error::The pull request merge commit has changed."
            exit 1
          fi

      - name: Deploy preview
        id: workers
        uses: hakula139/devkit/.github/actions/workers@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Require a preview deployment
        if: steps.workers.outputs.applied != 'true'
        run: exit 1

      - name: Format preview comment metadata
        id: meta
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          deploy_time=$(date -u +'%Y-%m-%d %H:%M UTC')
          printf 'short_sha=%s\ndeploy_time=%s\n' "${PR_SHA:0:7}" "$deploy_time" >>"$GITHUB_OUTPUT"

      - name: Comment preview
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url
          message: |
            ## ⚡ Cloudflare Workers preview

            - [Stable preview](${{ steps.workers.outputs.preview-url }})
            - [Preview for commit `${{ steps.meta.outputs.short_sha }}`](${{ steps.workers.outputs.deployment-url }})
            - Updated ${{ steps.meta.outputs.deploy_time }}

            [View deploy logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
