name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Shared with Preview cleanup, so closing a PR cancels its in-flight deploy.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHIX_NAME: hakula

jobs:
  build:
    # Pull requests from forks receive no deploy secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true
      base-url: https://pr-${{ github.event.pull_request.number }}-hakula-xyz-kiln.hakula.workers.dev

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.meta.outputs.deployment_url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix_name: ${{ env.CACHIX_NAME }}
          cachix_skip_push: 'true'

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: site-public
          path: public/

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler appends one JSON record per command to this file, including the Preview's URLs.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          nix develop -c pnpm exec wrangler preview \
            --name "pr-$PR_NUMBER" \
            --message "PR #$PR_NUMBER @ $PR_SHA"

      - name: Extract preview metadata
        id: meta
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          record=$(jq -c 'select(.type == "preview")' "$WRANGLER_OUTPUT_FILE_PATH")
          preview_url=$(jq -er '.preview_urls[0]' <<<"$record")
          deployment_url=$(jq -er '.deployment_urls[0]' <<<"$record")
          deploy_time=$(date -u +'%Y-%m-%d %H:%M UTC')
          cat >> "$GITHUB_OUTPUT" <<OUTPUT
          short_sha=${PR_SHA:0:7}
          preview_url=$preview_url
          deployment_url=$deployment_url
          deploy_time=$deploy_time
          OUTPUT

      - name: Comment preview
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview-url
          message: |
            ## ⚡ Cloudflare Workers preview

            <table>
              <tr>
                <td><strong>Preview</strong></td>
                <td><a href="${{ steps.meta.outputs.preview_url }}">${{ steps.meta.outputs.preview_url }}</a></td>
              </tr>
              <tr>
                <td><strong>This commit</strong></td>
                <td><a href="${{ steps.meta.outputs.deployment_url }}">${{ steps.meta.outputs.deployment_url }}</a></td>
              </tr>
              <tr>
                <td><strong>Commit</strong></td>
                <td><code>${{ steps.meta.outputs.short_sha }}</code></td>
              </tr>
              <tr>
                <td><strong>Updated</strong></td>
                <td>${{ steps.meta.outputs.deploy_time }}</td>
              </tr>
            </table>

            [View deploy logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
