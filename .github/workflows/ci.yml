name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v1

      - name: Run flake check
        run: nix flake check

  check:
    name: Site Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Nix
        uses: hakula139/devkit/.github/actions/setup-nix@v1

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Format
        run: nix develop -c pnpm format

      - name: Lint
        run: nix develop -c pnpm lint

      - name: Spell check
        run: nix develop -c pnpm spellcheck

  build:
    uses: ./.github/workflows/build.yml

  result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs: [flake-check, check, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    timeout-minutes: 5
    steps:
      - uses: hakula139/devkit/.github/actions/ci-result@v1
